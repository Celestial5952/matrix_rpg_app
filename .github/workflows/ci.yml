name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python -m pytest -q

  docker:
    # Build only — publishing is publish.yml's job. This catches a Dockerfile
    # or requirements change that breaks the image before it reaches main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: guildhall:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image starts as a non-root user and refuses to run unconfigured
        run: |
          test "$(docker run --rm guildhall:ci id -u)" != "0"
          docker run --rm guildhall:ci 2>&1 | grep -q "missing required environment variable"
